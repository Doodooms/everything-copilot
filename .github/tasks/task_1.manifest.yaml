id: task_1
title: Import high-value ECC agents
description: Import six high-value portable agents from Everything Claude Code, adapt them to the local VS Code agent contract, and synchronize the authoritative inventory surfaces.
change_type: patch
base_branch: main
plan_index:
  repo_structure:
    - path: .github/agents
      reason: New agent definitions are added here using the local .agent.md contract.
    - path: .github/PLAN.md
      reason: Authoritative inventory and roadmap must reflect the imported agents.
    - path: .github/copilot-instructions.md
      reason: Always-on agent inventory must stay aligned with what actually exists.
    - path: .github/tasks
      reason: Manifest persistence for the approved orchestration record.
    - path: .github/plan_history
      reason: Audit record and plan snapshot for this task.
  sections:
    - id: implementation_roadmap
      heading: Implementation Roadmap
      summary: P2 roadmap entries for the six pending high-value agent imports.
      lines: [242, 256]
test_commands:
  - rg --line-number "code-architect|code-explorer|database-reviewer|silent-failure-hunter|pr-test-analyzer|e2e-runner" .github/PLAN.md .github/copilot-instructions.md
  - rg --files .github/agents | rg "code-architect|code-explorer|database-reviewer|silent-failure-hunter|pr-test-analyzer|e2e-runner"
apply_policy: require_manual
risk_level: medium
approve_required: false
assumptions:
  - id: A1
    description: Keep canonical ECC agent names unless a local VS Code constraint makes a rename materially better.
    made_by: GitHub Copilot
    date: 2026-05-08
  - id: A2
    description: Adapt imported agents to the established local frontmatter contract using target/model/tools rather than raw ECC tool declarations.
    made_by: GitHub Copilot
    date: 2026-05-08
uncertainties:
  - id: U1
    description: The ECC e2e-runner assumes Agent Browser as the primary execution surface, which is not a native dependency of this workspace.
    impact: Medium risk of mismatched guidance if imported verbatim.
    mitigation: Rewrite the execution guidance around the local browser and Playwright-capable VS Code tool surface while preserving the testing intent.
  - id: U2
    description: The database-reviewer agent is PostgreSQL-specific and may need scope wording that clarifies its intended use in this language-agnostic workflow repo.
    impact: Low risk of inventory ambiguity.
    mitigation: Keep the canonical name and explicitly describe the specialization in the agent description.
