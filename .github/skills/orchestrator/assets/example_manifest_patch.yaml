id: demo-run-tests-001
title: Ensure datamodule uses external COCO splits
description: Verify ClassificationDataModule reads annotations/<version>/*.coco.json and avoids internal random splits
change_type: patch
base_branch: main
plan_index:
  repo_structure:
    - path: src/datasets
      reason: "datamodule + dataset loaders"
    - path: tests/units
      reason: "unit tests to validate behavior"
  sections:
    - id: training_contract
      heading: "Training contract"
      summary: "MUST use externally prepared COCO split files"
patches:
  - file: src/datasets/data_module.py
    patch: |
      *** Begin Patch
      *** Update File: src/datasets/data_module.py
      @@
      -    # old line
      +    # ensure loader reads annotations/<version>/*.coco.json
      *** End Patch
    summary: Ensure datamodule uses external COCO split files
    test_commands:
      - "(Set-ExecutionPolicy -Scope Process -ExecutionPolicy RemoteSigned) ; .venv\Scripts\python -m pytest tests/units/test_datamodule_splits.py -q"
    risk_level: low
apply_policy: require_manual
expected_files_changed_limit: 2
expected_loc_limit: 200
approve_required: true
