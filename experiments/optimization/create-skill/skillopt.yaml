# SkillOpt 0.2.0 configuration for the frozen create-skill benchmark.
# The unseen generalization split is intentionally not referenced here.
model:
  backend: codex_exec
  optimizer: gpt-5.6-luna
  target: gpt-5.6-luna
  optimizer_backend: openai_chat
  target_backend: codex_exec

train:
  num_epochs: 1
  train_size: 3
  steps_per_epoch: 3
  batch_size: 1
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 1
  merge_batch_size: 1
  analyst_workers: 1
  max_analyst_rounds: 1
  failure_only: true

optimizer:
  learning_rate: 1
  min_learning_rate: 1
  lr_scheduler: constant
  lr_control_mode: fixed
  skill_update_mode: patch

evaluation:
  sel_env_num: 1
  test_env_num: 1
  eval_test: false
  use_gate: false

env:
  name: create-skill
  skill_init: experiments/optimization/create-skill/benchmark/SKILL.md
  out_root: outputs/skillopt-create-skill
  eval_root: experiments/optimization/create-skill/benchmark
  canonical_config: config/canonical-skill-architecture.json
  waza_bin: .tools/bin/waza