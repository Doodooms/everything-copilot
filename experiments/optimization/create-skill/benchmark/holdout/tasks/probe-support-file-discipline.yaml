id: probe-support-file-discipline
name: 'probe-support-file-discipline: Authoring, repairing, restructuring, reviewing,
  and validating a production-ready skill named create-skill. Create or update deterministic
  VS Code skill packages from a clear specification. This includes authoring, repairing,
  restructuring, reviewing, or validating a skill and its support files. Define its
  exact purpose and boundaries, include concrete acceptance and rejection cases, preserve
  the canonical inline workflow and grouped ACCEPT/REJECT architecture, keep provenance,
  and include only support files that the workflow truly consumes. Do not create agents,
  prompts, MCP servers, or hooks; do not perform general application implementation
  or benchmark optimization. Validate the package and report unresolved risks. Exercise
  asset consumption and support-file discipline: use assets, references, and scripts
  only at the point of need, keep them self-contained, and do not claim frozen support
  files were optimized.'
description: 'Consumption of assets and references without inventing or front-loading
  unused support files. Authoring, repairing, restructuring, reviewing, and validating
  a production-ready skill named create-skill. Create or update deterministic VS Code
  skill packages from a clear specification. This includes authoring, repairing, restructuring,
  reviewing, or validating a skill and its support files. Define its exact purpose
  and boundaries, include concrete acceptance and rejection cases, preserve the canonical
  inline workflow and grouped ACCEPT/REJECT architecture, keep provenance, and include
  only support files that the workflow truly consumes. Do not create agents, prompts,
  MCP servers, or hooks; do not perform general application implementation or benchmark
  optimization. Validate the package and report unresolved risks. Exercise asset consumption
  and support-file discipline: use assets, references, and scripts only at the point
  of need, keep them self-contained, and do not claim frozen support files were optimized.
  DO NOT USE FOR: agents, prompts, MCP servers, hooks, benchmark optimization, or
  general application implementation.'
