id: probe-support-file-discipline
name: probe-support-file-discipline
description: Consumption of assets and references without inventing or front-loading
  unused support files.
evaluates: Consumption of assets and references without inventing or front-loading
  unused support files.
family: support-file-discipline
tags:
- probe
- holdout
- family:support-file-discipline
inputs:
  prompt: 'Authoring, repairing, restructuring, reviewing, and validating a production-ready
    skill named create-skill. Create or update deterministic VS Code skill packages
    from a clear specification. This includes authoring, repairing, restructuring,
    reviewing, or validating a skill and its support files. Define its exact purpose
    and boundaries, include concrete acceptance and rejection cases, preserve the
    canonical inline workflow and grouped ACCEPT/REJECT architecture, keep provenance,
    and include only support files that the workflow truly consumes. Validate the
    package and report unresolved risks. Exercise asset consumption and support-file
    discipline: use assets, references, and scripts only at the point of need, keep
    them self-contained, and do not claim frozen support files were optimized.'
  files:
  - path: SKILL.md
  - path: .github/skills/create-skill/SKILL.md
  - path: .github/skills/create-skill/assets/ask_questions.json
  - path: .github/skills/create-skill/assets/folder-template.md
  - path: .github/skills/create-skill/assets/skill-template.md
  - path: .github/skills/create-skill/references/ask_questions.md
  - path: .github/skills/create-skill/references/final-checklist.md
  - path: .github/skills/create-skill/references/latest-docs.md
  - path: .github/skills/create-skill/references/original-spec.md
  - path: .github/skills/create-skill/references/validation.md
  - path: .github/skills/create-skill/scripts/lint.py
  - path: .github/skills/create-skill/scripts/scaffold.py
  - path: .github/skills/create-skill/scripts/skill_lint_core.py
  - path: .github/skills/create-skill/scripts/validate.py
expected:
  should_trigger: true
  hard_gates: &id001
  - package_validity
  - self_containment
  - provenance
oracle:
  type: package-contract
  required_paths:
  - SKILL.md
  - .github/skills/create-skill/SKILL.md
  - .github/skills/create-skill/assets/ask_questions.json
  - .github/skills/create-skill/assets/folder-template.md
  - .github/skills/create-skill/assets/skill-template.md
  - .github/skills/create-skill/references/ask_questions.md
  - .github/skills/create-skill/references/final-checklist.md
  - .github/skills/create-skill/references/latest-docs.md
  - .github/skills/create-skill/references/original-spec.md
  - .github/skills/create-skill/references/validation.md
  - .github/skills/create-skill/scripts/lint.py
  - .github/skills/create-skill/scripts/scaffold.py
  - .github/skills/create-skill/scripts/skill_lint_core.py
  - .github/skills/create-skill/scripts/validate.py
  required_support_files:
  - assets/ask_questions.json
  - assets/folder-template.md
  - assets/skill-template.md
  - references/ask_questions.md
  - references/final-checklist.md
  - references/latest-docs.md
  - references/original-spec.md
  - references/validation.md
  - scripts/lint.py
  - scripts/scaffold.py
  - scripts/skill_lint_core.py
  - scripts/validate.py
  provenance_path: .github/skills/create-skill/references/original-spec.md
  support_files_optimized: false
  hard_gates: *id001
  judge_dimensions:
  - self-contained support-file discipline
