id: probe-scripts-validation
name: 'probe-scripts-validation: Authoring, repairing, restructuring, reviewing, and
  validating a production-ready skill named create-skill. Create or update deterministic
  VS Code skill packages from a clear specification. This includes authoring, repairing,
  restructuring, reviewing, or validating a skill and its support files. Define its
  exact purpose and boundaries, include concrete acceptance and rejection cases, preserve
  the canonical inline workflow and grouped ACCEPT/REJECT architecture, keep provenance,
  and include only support files that the workflow truly consumes. Do not create agents,
  prompts, MCP servers, or hooks; do not perform general application implementation
  or benchmark optimization. Validate the package and report unresolved risks. Exercise
  scripts self-containment and executable validation/repair: run package-local checks,
  recover from a failed validation, and preserve the canonical scaffold.'
description: 'Self-contained scripts, executable validation, and repair after validation
  failures. Authoring, repairing, restructuring, reviewing, and validating a production-ready
  skill named create-skill. Create or update deterministic VS Code skill packages
  from a clear specification. This includes authoring, repairing, restructuring, reviewing,
  or validating a skill and its support files. Define its exact purpose and boundaries,
  include concrete acceptance and rejection cases, preserve the canonical inline workflow
  and grouped ACCEPT/REJECT architecture, keep provenance, and include only support
  files that the workflow truly consumes. Do not create agents, prompts, MCP servers,
  or hooks; do not perform general application implementation or benchmark optimization.
  Validate the package and report unresolved risks. Exercise scripts self-containment
  and executable validation/repair: run package-local checks, recover from a failed
  validation, and preserve the canonical scaffold. DO NOT USE FOR: agents, prompts,
  MCP servers, hooks, benchmark optimization, or general application implementation.'
