id: skill-dependency-mapping
name: 'skill-dependency-mapping: Authoring, repairing, restructuring, reviewing, and
  validating a production-ready skill named dependency-mapping. Create or update deterministic
  VS Code skill packages from a clear specification. This includes authoring, repairing,
  restructuring, reviewing, or validating a skill and its support files. Define its
  exact purpose and boundaries, include concrete acceptance and rejection cases, preserve
  the canonical inline workflow and grouped ACCEPT/REJECT architecture, keep provenance,
  and include only support files that the workflow truly consumes. Do not create agents,
  prompts, MCP servers, or hooks; do not perform general application implementation
  or benchmark optimization. Validate the package and report unresolved risks.'
