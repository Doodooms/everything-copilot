id: app-saas-billing
name: 'app-saas-billing: Authoring, repairing, restructuring, reviewing, and validating
  a production-ready skill that guides implementation of a multi-tenant billing dashboard.
  Create or update deterministic VS Code skill packages from a clear specification.
  This includes authoring, repairing, restructuring, reviewing, or validating a skill
  and its support files. The skill must turn this request into an executable, testable
  workflow: Implement tenant isolation, invoice history, role-based access, and idempotent
  payment actions with an auditable verification path. Define the domain ontology,
  semantic boundaries, acceptance criteria, failure handling, security and verification
  gates, and enough downstream guidance for another agent to implement the project
  coherently. Use the canonical inline grouped-list architecture, preserve source
  provenance, and reject requests to create agents, prompts, MCP servers, hooks, general
  application implementations, or benchmark optimizations.'
description: 'Guidance quality for downstream project implementation, acceptance,
