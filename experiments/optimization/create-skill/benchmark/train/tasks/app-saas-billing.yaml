  clear specification. This includes authoring, repairing, restructuring, reviewing,
  or validating a skill and its support files. The skill must turn this request into
  an executable, testable workflow: Implement tenant isolation, invoice history, role-based
  access, and idempotent payment actions with an auditable verification path. Define
  the domain ontology, semantic boundaries, acceptance criteria, failure handling,
  security and verification gates, and enough downstream guidance for another agent
  to implement the project coherently. Use the canonical inline grouped-list architecture,
  preserve source provenance, and reject requests to create agents, prompts, MCP servers,
  hooks, general application implementations, or benchmark optimizations. DO NOT USE
  FOR: agents, prompts, MCP servers, hooks, benchmark optimization, or general application
  implementation.'
